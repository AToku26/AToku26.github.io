# Construye el portafolio y lo publica en GitHub Pages.
# - Al subir cambios a main: construye y publica.
# - En un pull request: solo construye, para comprobar que no haya errores antes de unirlo.
# Puedes ver el progreso en la pestaña "Actions" de tu repositorio.
name: Publicar portafolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Construir el sitio
        run: npm run build

      - name: Preparar archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
